name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch-starter
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  vscode:
    name: VS Code ${{ matrix.vscode }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [stable, 1.85.2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run fetch-starter
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: Install the .vsix and test it in VS Code
        run: xvfb-run -a node test/e2e/run.mjs --vsix "$(ls dist/*.vsix)"
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
