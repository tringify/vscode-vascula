name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: Check the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
          test -f "dist/vscode-vascula-${version}.vsix"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## ${version}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md)"
          gh release create "${GITHUB_REF_NAME}" "dist/vscode-vascula-${version}.vsix" \
            --title "${GITHUB_REF_NAME}" --notes "${notes:-Release ${GITHUB_REF_NAME}}" --verify-tag

  publish:
    name: Publish to marketplaces
    needs: release
    runs-on: ubuntu-latest
    # Both marketplaces trust this workflow (trusted publishing): the job's OIDC token
    # replaces access tokens.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist
      - name: Visual Studio Marketplace
        run: npx @vscode/vsce publish --oidc --packagePath "dist/vscode-vascula-${GITHUB_REF_NAME#v}.vsix"
      - name: Open VSX
        run: npx ovsx publish --trusted-publishing --packagePath "dist/vscode-vascula-${GITHUB_REF_NAME#v}.vsix"
